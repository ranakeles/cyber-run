<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Siber Koşu — Turkish Technology</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Oyun yazıları: Fredoka (yuvarlak, oyuncu) + Nunito (sıcak, okunaklı).
       E-postalar bilerek nötr sistem yazı tipiyle çizilir (gerçek posta hissi). -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Uçuş sahnesi bu tuvale çizilir -->
<canvas id="game"></canvas>

<!-- ÜST BİLGİ -->
<div id="hud" class="hidden">
  <!-- HUD tamamen görsel: kalpler "can", kupalı sayaç "puan" demek — yazı gerekmiyor.
       İçerikleri script dolduruyor (life.png / life2.png / skor_tablosu.png / score_numbers.png) -->
  <div class="hud-item"><div class="hud-can" id="lifeVal"></div></div>
  <div class="hud-item"><div class="hud-score" id="scoreBox"><div class="score-digits rakam-dizi" id="scoreVal"></div></div></div>
</div>

<!-- ================= BAŞLANGIÇ =================
     Arkada oyun sahnesi canlı akar; üstte sadece hafif bir vinyet + panel. -->
<div id="startScreen" class="overlay home">
  <!-- Arkada bulanık kopya: ekran oranı görselden farklıysa yanlar boş kalmasın -->
  <img id="homeBg"  class="home-bg"  alt="" aria-hidden="true">
  <!-- Asıl tasarım: hiçbir yeri kırpılmadan tam görünür -->
  <img id="homeImg" class="home-img" alt="Siber Koşu">
  <!-- Tüm ekran dokunmatik: çocuk nereye basarsa bassın oyun başlar -->
  <button id="startBtn" class="home-hit" aria-label="Oyna"></button>
</div>

<!-- ================= SORU EKRANI (uçuş sırasında açılır) ================= -->
<div id="questionScreen" class="q-overlay hidden">
  <div class="q-inner">
    <div class="q-head">✉️ GELEN E-POSTA — İNCELE VE KARAR VER</div>
    <div id="stage"><!-- e-posta kartı buraya --></div>
    <div class="zones">
      <button class="zone safe" id="zoneSafe">
        <svg class="zi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2l8 3v6c0 5-3.4 8.6-8 11-4.6-2.4-8-6-8-11V5l8-3z"/><path d="M9 12l2 2 4-4" stroke-width="1.9"/></svg>
        <div><div class="zt">GÜVENLİ</div><div class="zs">geçişe izin ver</div></div>
      </button>
      <button class="zone danger" id="zoneDanger">
        <svg class="zi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2l8 3v6c0 5-3.4 8.6-8 11-4.6-2.4-8-6-8-11V5l8-3z"/><path d="M9 9l6 6M15 9l-6 6" stroke-width="1.9"/></svg>
        <div><div class="zt">ŞÜPHELİ</div><div class="zs">saldırıyı durdur</div></div>
      </button>
    </div>
  </div>
</div>

<!-- ================= GERİ BİLDİRİM ================= -->
<div class="flash" id="flash"><div class="fcard">
  <div class="ftag" id="fTag"></div>
  <div class="fwhy" id="fWhy"></div>
  <div class="fpts" id="fPts"></div>
</div></div>

<!-- ================= BİTİŞ ================= -->
<!-- Tasarımın tamamı end_page2.png; kod sadece boş kutuları dolduruyor ve
     görseldeki butonların üstüne görünmez dokunma alanları koyuyor.
     Kutu koordinatları görselden ÖLÇÜLDÜ (bkz. style.css .end-* kuralları). -->
<div id="endScreen" class="overlay home hidden">
  <img id="endBg" class="home-bg" alt="" aria-hidden="true">
  <div class="end-stage" id="endStage">
    <!-- Kurdele: sadece bu oyunun skoru (HUD'daki rakam görselleriyle) -->
    <div class="end-skor rakam-dizi" id="endSkor"></div>
    <!-- Büyük panel: oynayanların sıralaması -->
    <div class="end-lb" id="lbRows"></div>
    <button class="end-hit end-home"  id="homeBtn"  aria-label="Ana sayfa"></button>
    <button class="end-hit end-again" id="againBtn" aria-label="Tekrar dene"></button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
