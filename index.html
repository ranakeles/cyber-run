<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Siber Koşu — Turkish Technology</title>
  <!-- Yazı tipleri Google'dan DEĞİL, assets/fonts/ içinden yükleniyor
       (@font-face kuralları style.css'in başında). Kiosk internetsiz
       çalışacağı için dışarıdan font çekmek riskliydi. -->
  <meta name="color-scheme" content="light">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Uçuş sahnesi bu tuvale çizilir -->
<canvas id="game"></canvas>

<!-- ÜST BİLGİ -->
<div id="hud" class="hidden">
  <!-- HUD tamamen görsel: kalpler "can", kupalı sayaç "puan" demek — yazı gerekmiyor.
       İçerikleri script dolduruyor (life.png / life2.png / skor_tablosu.png / score_numbers.png) -->
  <!-- Solda alt alta: üstte puan sayacı, altında canlar -->
  <div class="hud-sol">
    <div class="hud-item"><div class="hud-score" id="scoreBox"><div class="score-digits rakam-dizi" id="scoreVal"></div></div></div>
    <div class="hud-item"><div class="hud-can" id="lifeVal"></div></div>
  </div>
  <!-- Duraklatma sağ üstte. Görselin tamamı pause_button.png; kod sadece
       dokunma alanı veriyor. -->
  <button id="pauseBtn" class="hud-pause" aria-label="Duraklat"></button>
</div>

<!-- ================= DURAKLAMA =================
     Tam ekran değil: donmuş oyunun üstünde duran bir kart (pause_card.png,
     şeffaf zeminli). Arkadaki karartma koddan gelir — çizim değil, düz bir
     yarı saydam katman. Buton kutuları görselden ÖLÇÜLDÜ (.pause-* kuralları). -->
<div id="pauseScreen" class="pause-overlay hidden">
  <div class="pause-stage" id="pauseStage">
    <button class="pause-hit pause-resume" id="resumeBtn"    aria-label="Devam et"></button>
    <button class="pause-hit pause-home"   id="pauseHomeBtn" aria-label="Ana sayfa"></button>
  </div>
</div>

<!-- ================= GERİ SAYIM =================
     DEVAM ET'ten sonra 3-2-1. Rakamlar HUD ve bitiş ekranıyla AYNI görselden
     (score_numbers.png) diziliyor — oyunda ikinci bir rakam takımı olmasın. -->
<div id="countScreen" class="sayim-katman hidden">
  <div class="sayim-rakam rakam-dizi" id="countVal"></div>
</div>

<!-- ================= BAŞLANGIÇ =================
     Arkada oyun sahnesi canlı akar; üstte sadece hafif bir vinyet + panel. -->
<div id="startScreen" class="overlay home">
  <!-- Arkada bulanık kopya: ekran oranı görselden farklıysa yanlar boş kalmasın -->
  <img id="homeBg"  class="home-bg"  alt="" aria-hidden="true">
  <!-- Asıl tasarım: hiçbir yeri kırpılmadan tam görünür -->
  <img id="homeImg" class="home-img" alt="Siber Koşu">
  <!-- Tüm ekran dokunmatik: çocuk nereye basarsa bassın oyun başlar -->
  <button id="startBtn" class="home-hit" aria-label="Oyna"></button>
</div>

<!-- ================= KARAKTER SEÇİMİ =================
     OYNA'ya basınca açılır, isim ekranından ÖNCE gelir. Tasarımın tamamı
     character_page.png; kod yalnızca iki madalyonun üstüne görünmez dokunma
     alanı koyuyor. Seçilen karakter koşu karelerini, duraklama kartını ve
     bitiş ekranını birden belirliyor. -->
<div id="charScreen" class="overlay home hidden">
  <img id="charBg" class="home-bg" alt="" aria-hidden="true">
  <div class="char-stage" id="charStage">
    <button class="char-hit char-boy"  id="pickBoy"  aria-label="Erkek karakter"></button>
    <button class="char-hit char-girl" id="pickGirl" aria-label="Kız karakter"></button>
  </div>
</div>

<!-- ================= İSİM GİRİŞİ =================
     OYNA'ya basınca açılır, oyun bundan sonra başlar. Klavye kodla kurulur
     (script.js KLAVYE dizisi) — tuşların basılma durumu ve Türkçe harfler
     gerektiği için görsel olarak hazırlanamaz. -->
<div id="nameScreen" class="overlay home hidden">
  <img id="nameBg" class="home-bg" alt="" aria-hidden="true">
  <div class="name-stage" id="nameStage">
    <div class="name-yazi"><span id="nameText"></span><i class="imlec"></i></div>
    <!-- BAŞLA görselde çizili; yeterli harf yazılmadan üstü soluklaştırılır -->
    <div class="name-kilit" id="nameLock"></div>
    <!-- Tuşların üstündeki görünmez dokunma alanları script'te üretilir -->
  </div>
</div>

<!-- ================= NASIL OYNANIR =================
     İsim girişinden sonra, koşu başlamadan önce açılır. Kart popup ama
     ARKASI OYUN DEĞİL, düz renk: oyun henüz başlamadı, arkada sokağı
     göstermek "oyun çoktan başladı" hissi veriyordu. Renk karakter seçim
     ekranının zeminiyle aynı (#002292), iki ekran birbirini takip ediyor.
     Her karakterin kartı ayrı görsel (how_to_play_boy.png /
     how_to_play_girl.png), seçilen karaktere göre açılıyor. Kutular
     script'teki NASIL_YERI tablosundan gelir, o da görselden ölçüldü. -->
<div id="howScreen" class="pause-overlay how-overlay hidden">
  <div class="pause-stage how-stage" id="howStage">
    <button class="pause-hit how-start" id="howStartBtn" aria-label="Hadi başla"></button>
  </div>
</div>

<!-- ================= SORU EKRANI (uçuş sırasında açılır) ================= -->
<div id="questionScreen" class="q-overlay hidden">
  <!-- Kart ve butonlar görselde çizili (mail_body.png / mail_file.png).
       Kod yalnızca metinleri yerleştirir; konumlar script'teki MAIL_YERI
       tablosundan gelir, o da görsellerden ölçüldü. -->
  <div class="mail-stage" id="mailStage">
    <div class="mail-ust" id="qHead">
      <div class="mail-kim" id="qFrom"></div>
      <div class="mail-adres" id="qAddr"></div>
    </div>
    <div class="mail-govde" id="qBody"></div>
    <div class="mail-ek" id="qAttach"></div>
    <button class="mail-hit" id="zoneSafe"   aria-label="Güvenli"></button>
    <button class="mail-hit" id="zoneDanger" aria-label="Şüpheli"></button>
  </div>
</div>

<!-- ================= GERİ BİLDİRİM ================= -->
<!-- Kartın tamamı answers.png'de çizili (solda DOĞRU, sağda YANLIŞ);
     kod yalnızca açıklamayı ve puan satırını yerleştirir. -->
<div class="flash" id="flash">
  <div class="cevap-kart" id="answerCard">
    <div class="cevap-aciklama" id="fWhy"></div>
    <div class="cevap-puan" id="fPts"></div>
  </div>
</div>

<!-- ================= BİTİŞ ================= -->
<!-- Tasarımın tamamı end_page2.png; kod sadece boş kutuları dolduruyor ve
     görseldeki butonların üstüne görünmez dokunma alanları koyuyor.
     Kutu koordinatları görselden ÖLÇÜLDÜ (bkz. style.css .end-* kuralları). -->
<div id="endScreen" class="overlay home hidden">
  <img id="endBg" class="home-bg" alt="" aria-hidden="true">
  <div class="end-stage" id="endStage">
    <!-- Kurdele: sadece bu oyunun skoru (HUD'daki rakam görselleriyle) -->
    <div class="end-skor rakam-dizi" id="endSkor"></div>
    <!-- Büyük panel: oynayanların sıralaması -->
    <div class="end-lb" id="lbRows"></div>
    <button class="end-hit end-home"  id="homeBtn"  aria-label="Ana sayfa"></button>
    <button class="end-hit end-again" id="againBtn" aria-label="Tekrar dene"></button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
